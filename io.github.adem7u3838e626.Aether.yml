# Flatpak manifest for Aether.
#
# Local build (run from repo root after committing your changes):
#
#   flatpak install -y flathub org.kde.Platform//6.11 org.kde.Sdk//6.11
#   ./scripts/build-run-flatpak.sh
#
# To pass arguments to Aether, append them to the script invocation.
#
# For local iteration without committing, swap the `aether` module's source
# from `type: git` to `type: dir, path: .` (see comment below).
#
# For Flathub submission, this file is copied to a separate flathub repo
# and the `aether` source must stay as `type: git` with a pinned tag/commit.

app-id: io.github.adem7u3838e626.Aether
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: aether

finish-args:
  # Display + input
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  # Network — required for the Remote Access feature (sftp/ftp/dav via gvfs)
  - --share=network

  # File manager scope: needs to read/write user files anywhere on the host.
  # Flathub reviewers grant this exception for general-purpose file managers
  # (Nautilus, Dolphin, Files use the same). `--filesystem=host` already
  # covers /mnt, /media, /run/media at their real paths through host bind
  # mounts, so no separate --filesystem entries are needed for those.
  - --filesystem=host
  # Access GVFS mounts (sftp:// etc.) exposed via the user runtime dir
  - --filesystem=xdg-run/gvfs
  - --filesystem=xdg-run/gvfsd

  # DBus
  # Mount/unmount removable devices (DeviceModel)
  - --system-talk-name=org.freedesktop.UDisks2
  # Required by `flatpak-spawn --host` so FileOperations can route
  # openFile / openFileWith / gio trash through the host, using the host's
  # default applications and the host's XDG trash instead of sandbox-local
  # copies. Same pattern as the Nautilus and Dolphin flatpaks.
  - --talk-name=org.freedesktop.Flatpak

  # Prefer Wayland, fall back to xcb
  - --env=QT_QPA_PLATFORM=wayland;xcb

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'

modules:
  # ── Lua 5.4 ──────────────────────────────────────────────────────────
  # PluginManager embeds Lua scripts and the KDE runtime does not provide
  # the lua5.4 pkg-config module required by the application.
  - name: lua
    buildsystem: simple
    build-commands:
      - make linux
      - make install INSTALL_TOP=/app INSTALL_MAN=/app/share/man/man1
      # Lua's upstream Makefile does not install a pkg-config file.
      - install -d /app/lib/pkgconfig
      - |
        cat > /app/lib/pkgconfig/lua5.4.pc <<'EOF'
        prefix=/app
        exec_prefix=${prefix}
        libdir=${prefix}/lib
        includedir=${prefix}/include

        Name: Lua
        Description: Lua language library
        Version: 5.4.8
        Libs: -L${libdir} -llua -lm -ldl
        Cflags: -I${includedir}
        EOF
    sources:
      - type: archive
        url: https://www.lua.org/ftp/lua-5.4.8.tar.gz
        sha256: 4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae

  # ── wl-clipboard ───────────────────────────────────────────────────────
  # ClipboardManager spawns wl-copy / wl-paste. Bundle them so the
  # clipboard works without depending on host tools.
  #
  # We deliberately skip `meson install` because upstream's install rules
  # try to write fish completions to /usr/share/fish/vendor_completions.d,
  # which is read-only inside the Flatpak build sandbox. Instead we run
  # meson + ninja ourselves and install only the two binaries we need.
  - name: wl-clipboard
    buildsystem: simple
    build-commands:
      - meson setup _build --prefix=/app --buildtype=release
      - ninja -C _build
      - install -Dm755 _build/src/wl-copy /app/bin/wl-copy
      - install -Dm755 _build/src/wl-paste /app/bin/wl-paste
    sources:
      - type: git
        url: https://github.com/bugaevc/wl-clipboard.git
        tag: v2.2.1
        commit: 3eb912c274042cd5deed6b478b39908a12f37498

  # ── Aether ─────────────────────────────────────────────────────────────
  # ── poppler-utils ──────────────────────────────────────────────────────
  # PdfPreviewProvider, PreviewService and MetadataExtractor shell out to
  # pdftoppm and pdfinfo for PDF thumbnails, the quick-preview panel and PDF
  # metadata. A host poppler is invisible inside the sandbox and its binaries
  # are linked against host libraries, so installing poppler-utils on the host
  # cannot help (issue #18). Build the two utils here instead.
  #
  # Everything they do not need is switched off: no Qt/glib/cpp wrappers, no
  # crypto backends, no curl, no tests. The runtime already provides freetype,
  # fontconfig and zlib, which are poppler's only hard requirements.
  #
  # Not bundled on purpose, having checked what org.kde.Platform already
  # ships: ffmpeg, ffprobe, tar, gzip, bzip2, xz, zstd, zip, unzip and bsdtar
  # are all in the runtime. 7z is absent but unused, because extracting and
  # listing .7z/.rar fall back to bsdtar and nothing creates .7z. git is
  # reached through flatpak-spawn --host. exiftool is skipped deliberately: it
  # is a Perl program, so it would drag a whole perl runtime in for camera
  # EXIF tags alone, and the dependency dialog already explains its absence.
  # md2html is *not* in this group: it is built below, because the host copy
  # would not be reachable from inside the sandbox.
  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_UTILS=ON
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
      - -DENABLE_GLIB=OFF
      - -DENABLE_CPP=OFF
      - -DENABLE_LIBCURL=OFF
      - -DENABLE_NSS3=OFF
      - -DENABLE_GPGME=OFF
      - -DENABLE_LIBTIFF=OFF
      - -DENABLE_BOOST=OFF
      - -DBUILD_GTK_TESTS=OFF
      - -DBUILD_QT5_TESTS=OFF
      - -DBUILD_QT6_TESTS=OFF
      - -DBUILD_CPP_TESTS=OFF
      - -DBUILD_MANUAL_TESTS=OFF
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-26.08.0.tar.xz
        sha256: dc906e68cea698109706ac6aa3d2c9d4512fcfcac42d90b8afcda486d1b9abd0
    cleanup:
      # It builds thirteen utils; aether calls two.
      - /bin/pdfattach
      - /bin/pdfdetach
      - /bin/pdffonts
      - /bin/pdfimages
      - /bin/pdfseparate
      - /bin/pdfsig
      - /bin/pdftocairo
      - /bin/pdftohtml
      - /bin/pdftops
      - /bin/pdftotext
      - /bin/pdfunite

  # ── md4c (md2html) ─────────────────────────────────────────────────────
  # PreviewService renders Markdown by piping the file through `md2html`,
  # which lives in md4c. Unlike git (reached through flatpak-spawn --host)
  # this cannot use the host copy: it would not be visible at a stable path
  # inside the sandbox, and the whole point is a preview that works for
  # every Flatpak user. So build it here, exactly as poppler is.
  #
  # md4c is one C file plus a small CLI. A static build (`BUILD_SHARED_LIBS`
  # off, the default) makes md2html self-contained, and the only target
  # installed is the binary — nothing links against libmd4c at runtime.
  - name: md4c
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=OFF
      - -DBUILD_MD2HTML_EXECUTABLE=ON
    sources:
      - type: archive
        url: https://github.com/mity/md4c/archive/refs/tags/release-0.5.3.tar.gz
        sha256: 353c346f376b87c954a13f3415ede2d51264cc61dc5abcd38ff1d2aa0d059b9e

  # fd and bat are optional. The app falls back to its Qt search iterator
  # and plain text previews when these tools are unavailable. They are not
  # included here so the submission does not redistribute prebuilt binaries.
  - name: aether
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DAETHER_DATA_DIR=/app/share/Aether
      - -DBUILD_TESTS=OFF
      - -DAETHER_ENABLE_PCH=OFF
      - -DAETHER_ENABLE_UNITY_BUILD=OFF
    post-install:
      # Required by Flathub: every app must install its license file to
      # $FLATPAK_DEST/share/licenses/$FLATPAK_ID.
      - install -Dm644 LICENSE /app/share/licenses/io.github.adem7u3838e626.Aether/LICENSE
    sources:
      # ── FLATHUB SUBMISSION ──
      - type: git
        url: https://github.com/Adem7u3838e626/Aether.git
        commit: 2adac1795e3a6c0630daa8aaa8c6078621d2486e

      # ── LOCAL ITERATION ──
      # For testing uncommitted changes locally, comment out the git
      # source above and uncomment the dir source below. Remember to
      # revert before tagging a new release.
      # - type: dir
      #   path: .
